# Argo CD UI through Traefik: https://argocd.lab.local
# TLS passthrough, so Argo CD keeps serving its own certificate (no Argo CD config change needed).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: HostSNI(`argocd.lab.local`)
      services:
        - name: argocd-server
          port: 443
  tls:
    passthrough: true
