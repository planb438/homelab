# Lab TLS: a private CA ("homelab-ca") made by cert-manager. Any Ingress with
#   cert-manager.io/cluster-issuer: lab-ca
# gets a real certificate signed by it. Trust the CA once on your desktop (labs/04-ingress-tls/README.md).
# On AWS: swap lab-ca for a Let's Encrypt ClusterIssuer (Route 53 DNS-01). Ingress manifests stay the same.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-ca
  secretName: homelab-ca
  duration: 87600h      # 10 years (lab only)
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: selfsigned-bootstrap, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: homelab-ca
