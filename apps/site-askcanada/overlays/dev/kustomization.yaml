# Lab copy of Ask Canada with logins + PostgreSQL. Live site is not touched.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: ask-
labels:
  - pairs: {app.kubernetes.io/part-of: site-askcanada}
    includeSelectors: true
resources:
  - ../../../sitekit/base
  - ingress.yaml
  - sealedsecret.yaml      # made by: scripts/seal-sitekit.sh askcanada dev <your-email>
configMapGenerator:
  - name: sitekit-config
    literals:
      - GITSYNC_REPO=https://github.com/planb438/ask-canada.git
      - SITE_NAME=Ask Canada (lab)
      - SITE_COLOR=#c8102e
      - PGHOST=ask-sitekit-db
      - 'FORMS={"question":{"title":"Ask a question","fields":[["name","Your name",false],["email","Email",true],["country","Country you are from",false],["question","Your question",true]]}}'
images:
  - name: ghcr.io/planb438/sitekit
    newTag: edge
patches:
  # the secret comes from a SealedSecret, which kustomize can't rename for us
  - target: {kind: Deployment, name: sitekit-web}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/envFrom/1/secretRef/name, value: ask-sitekit-secrets}
      - {op: replace, path: /spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name, value: ask-sitekit-secrets}
      - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
  - target: {kind: StatefulSet, name: sitekit-db}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/3/valueFrom/secretKeyRef/name, value: ask-sitekit-secrets}
