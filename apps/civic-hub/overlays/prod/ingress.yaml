apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civic-hub
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [askcanada.lab.local, grafana-askcanada.lab.local]
      secretName: civic-hub-tls
  rules:
    - host: askcanada.lab.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: civic-hub-web, port: {number: 80}}}}
    - host: grafana-askcanada.lab.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: civic-hub-grafana, port: {number: 80}}}}
