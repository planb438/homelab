# Grafana: ops + trend dashboards, reading the hub database with a READ-ONLY user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civic-hub-grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: civic-hub-grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: civic-hub-grafana}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: civic-hub-secrets, key: GRAFANA_ADMIN_PASSWORD}}
            - name: GRAFANA_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: civic-hub-secrets, key: GRAFANA_DB_PASSWORD}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_PATHS_DATA, value: /var/lib/grafana}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana-dashboards}
      volumes:
        - {name: data, emptyDir: {}}        # everything is provisioned from Git, nothing to keep
        - {name: tmp, emptyDir: {}}
        - {name: datasources, configMap: {name: civic-hub-grafana-datasources}}
        - {name: dashboard-provider, configMap: {name: civic-hub-grafana-provider}}
        - {name: dashboards, configMap: {name: civic-hub-grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata:
  name: civic-hub-grafana
spec:
  selector: {app.kubernetes.io/name: civic-hub-grafana}
  ports: [{name: http, port: 80, targetPort: http}]
