---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sitekit-secrets          # kustomize adds "hub-" -> hub-sitekit-secrets
  namespace: dev
spec:
  encryptedData:
    ADMIN_EMAIL: 
    ADMIN_PASSWORD: 
    POSTGRES_PASSWORD: 
    SECRET_KEY: 
  template:
    metadata:
      name: hub-sitekit-secrets
      namespace: dev
