# Nightly .xlsx copy of the HQ Google Sheets (read-only service account). Files land on the hq-backups volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hq-backups
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hq-backup
spec:
  schedule: "23 3 * * *"            # 03:23 every night
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app.kubernetes.io/name: hq-backup}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: ghcr.io/planb438/sitekit:edge
              command: ["python", "-m", "sitekit.hqbackup"]
              env:
                - {name: SA_FILE, value: /secrets/sa.json}
                - {name: OUT_DIR, value: /backups}
                - {name: KEEP_DAYS, value: "30"}
                - name: HQ_SHEETS
                  valueFrom: {secretKeyRef: {name: hq-backup-secrets, key: HQ_SHEETS}}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: sa, mountPath: /secrets, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: backups, persistentVolumeClaim: {claimName: hq-backups}}
            - name: sa
              secret: {secretName: hq-backup-secrets, items: [{key: sa.json, path: sa.json}], defaultMode: 0440}
            - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
# Nothing needs to connect to the backup job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hq-backup
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: hq-backup}
  policyTypes: [Ingress]
