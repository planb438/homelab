apiVersion: apps/v1
kind: Deployment
metadata:
  name: parkingclub
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 48Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: site, mountPath: /usr/share/nginx/html, readOnly: true}
            - {name: tmp, mountPath: /tmp}          # nginx pid + cache
      volumes:
        - name: site
          configMap: {name: parkingclub-site}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
