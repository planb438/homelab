apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [deployment.yaml, service.yaml]
configMapGenerator:
  - name: gatepark-site          # hash suffix -> pods roll when the page changes
    files: [site/index.html]
labels:
  - pairs: {app.kubernetes.io/name: gatepark}
    includeSelectors: true
