# Lab copy of Ask Authority (Canada, Bahamas, USA) with logins + PostgreSQL. Live site is not touched.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: aa-
labels:
  - pairs: {app.kubernetes.io/part-of: site-askauthority}
    includeSelectors: true
resources:
  - ../../../sitekit/base
  - ingress.yaml
  - sealedsecret.yaml      # made by: scripts/seal-sitekit.sh askauthority dev <your-email>
configMapGenerator:
  - name: sitekit-config
    literals:
      - GITSYNC_REF=dev          # lab follows the dev branch; live (GitHub Pages) follows main
      - GITSYNC_REPO=https://github.com/planb438/askauthority.git
      - SITE_NAME=Ask Authority (lab)
      - SITE_COLOR=#1f3a68
      - PGHOST=aa-sitekit-db
      - MODULES=qa              # community Q&A at /qa (apps/sitekit/app/sitekit/mod_qa.py)
      - SELF_SIGNUP=true
      - SIGNUP_ROLE=member
      - TZ=America/Toronto
      - 'ROLES=["admin", "staff", "member"]'
      - 'MODULE_CONFIG={"qa": {"categories": ["Canada · Immigration", "Canada · Taxes & benefits", "Canada · Everyday life", "Bahamas · Government services", "Bahamas · Passports & travel", "Bahamas · Business & work", "USA · Visas & travel", "USA · Everyday life", "Other"], "official_domains": ["canada.ca", "gc.ca", "gov.bs", "bahamas.gov.bs", "usa.gov", "uscis.gov", "state.gov", "irs.gov"], "intro": "Ask Authority answers everyday questions about Canada, The Bahamas and the USA. Official answers link to a government source."}}'
      - 'FORMS={"question":{"title":"Ask a question","fields":[["name","Your name",false],["email","Email",true],["country","Country you are from",false],["question","Your question",true]]}}'
images:
  - name: ghcr.io/planb438/sitekit
    newTag: 3a21081d3a0a705fc111217702d7d9af705c34e9
patches:
  # the secret comes from a SealedSecret, which kustomize can't rename for us
  - target: {kind: Deployment, name: sitekit-web}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/envFrom/1/secretRef/name, value: aa-sitekit-secrets}
      - {op: replace, path: /spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name, value: aa-sitekit-secrets}
      - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
  - target: {kind: StatefulSet, name: sitekit-db}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/3/valueFrom/secretKeyRef/name, value: aa-sitekit-secrets}
