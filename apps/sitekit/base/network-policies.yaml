# Database: only this site's web pod may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sitekit-db
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: sitekit-db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: sitekit-web}
      ports: [{port: 5432}]
---
# Web: only Traefik may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sitekit-web
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: sitekit-web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports: [{port: 8080}]
