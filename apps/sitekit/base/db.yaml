apiVersion: v1
kind: Service
metadata:
  name: sitekit-db
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: sitekit-db}
  ports: [{name: pg, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sitekit-db
spec:
  serviceName: sitekit-db
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sitekit-db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sitekit-db}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{name: pg, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: sitekit}
            - {name: POSTGRES_DB, value: sitekit}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: sitekit-secrets, key: POSTGRES_PASSWORD}}
          readinessProbe:
            exec: {command: [pg_isready, -U, sitekit, -d, sitekit]}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
