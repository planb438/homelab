# Lab copy of ACB Landscaping with logins + PostgreSQL. Live site is not touched.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: acb-
labels:
  - pairs: {app.kubernetes.io/part-of: site-acb}
    includeSelectors: true
resources:
  - ../../../sitekit/base
  - ingress.yaml
  - sealedsecret.yaml      # made by: scripts/seal-sitekit.sh acb dev <your-email>
configMapGenerator:
  - name: sitekit-config
    literals:
      - GITSYNC_REF=dev          # lab follows the dev branch; live (GitHub Pages) follows main
      - GITSYNC_REPO=https://github.com/planb438/acb-landscaping.git
      - SITE_NAME=ACB Landscaping (lab)
      - SITE_COLOR=#2e7d32
      - PGHOST=acb-sitekit-db
      - MODULES=acb             # ACB admin: clients, quotes, schedule, crews, invoices (apps/sitekit/app/sitekit/mod_acb.py)
      - TZ=America/Toronto
      - 'ROLES=["admin", "staff", "crew", "client"]'
      - 'MODULE_CONFIG={"acb": {"company": "ACB Landscaping", "phone": "416-319-8599", "tax_rate": 0.13, "tax_name": "HST", "review_url": "", "timezone": "America/Toronto"}}'
      - 'FORMS={"quote":{"title":"Request a quote","fields":[["name","Your name",true],["phone","Phone",true],["email","Email",true],["address","Property address",true],["service","Service (snow, lawn, cleanup…)",true],["details","Details",false]]}}'
images:
  - name: ghcr.io/planb438/sitekit
    newTag: 3a21081d3a0a705fc111217702d7d9af705c34e9
patches:
  # the secret comes from a SealedSecret, which kustomize can't rename for us
  - target: {kind: Deployment, name: sitekit-web}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/envFrom/1/secretRef/name, value: acb-sitekit-secrets}
      - {op: replace, path: /spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name, value: acb-sitekit-secrets}
      - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
  - target: {kind: StatefulSet, name: sitekit-db}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/3/valueFrom/secretKeyRef/name, value: acb-sitekit-secrets}
