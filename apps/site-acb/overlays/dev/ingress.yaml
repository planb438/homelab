apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sitekit
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [acb.dev.lab.local]
      secretName: acb-sitekit-tls
  rules:
    - host: acb.dev.lab.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: sitekit-web, port: {number: 80}}}}
