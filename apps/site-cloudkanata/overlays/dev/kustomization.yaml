# Lab copy of CloudKanata with logins + PostgreSQL. Live site is not touched.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: ck-
labels:
  - pairs: {app.kubernetes.io/part-of: site-cloudkanata}
    includeSelectors: true
resources:
  - ../../../sitekit/base
  - ingress.yaml
  - sealedsecret.yaml      # made by: scripts/seal-sitekit.sh cloudkanata dev <your-email>
configMapGenerator:
  - name: sitekit-config
    literals:
      - GITSYNC_REF=dev          # lab follows the dev branch; live (GitHub Pages) follows main
      - GITSYNC_REPO=https://github.com/planb438/cloudkanata-site.git
      - SITE_NAME=CloudKanata (lab)
      - SITE_COLOR=#0b6bcb
      - PGHOST=ck-sitekit-db
      - 'FORMS={"contact":{"title":"Contact CloudKanata","fields":[["name","Your name",true],["email","Email",true],["company","Company",false],["message","How can we help?",true]]}}'
images:
  - name: ghcr.io/planb438/sitekit
    newTag: edge   # CI replaces this with the commit sha after each build
patches:
  # the secret comes from a SealedSecret, which kustomize can't rename for us
  - target: {kind: Deployment, name: sitekit-web}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/envFrom/1/secretRef/name, value: ck-sitekit-secrets}
      - {op: replace, path: /spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name, value: ck-sitekit-secrets}
      - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
  - target: {kind: StatefulSet, name: sitekit-db}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/3/valueFrom/secretKeyRef/name, value: ck-sitekit-secrets}
