# The ops panel's identity. Least privilege: no pods/exec, no secrets, no RBAC, nodes read-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sitekit-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sitekit-ops
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [get, list, create, patch]
  - apiGroups: [""]
    resources: [pods, events, nodes]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sitekit-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sitekit-ops
subjects:
  - kind: ServiceAccount
    name: sitekit-ops
    namespace: dev
