apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pc-lab
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [pc.dev.lab.local]
      secretName: pc-lab-tls
  rules:
    - host: pc.dev.lab.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: pc-lab, port: {number: 80}}}}
