- name: Prepare all nodes
  hosts: k8s
  become: true
  roles: [common]

- name: Control plane
  hosts: control_plane
  become: true
  roles: [control_plane]

- name: Workers
  hosts: workers
  become: true
  roles: [worker]

# Encryption at rest, audit log and a first kube-bench report on every fresh build
- import_playbook: security.yml
