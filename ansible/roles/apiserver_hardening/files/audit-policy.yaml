# API audit policy: who did what, when. Request bodies only for RBAC changes and exec/attach,
# never for Secrets or ConfigMaps (so passwords don't end up in the log).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics", "/openapi*"]
  - level: None
    users: ["system:kube-proxy"]
    verbs: [watch]
  - level: None
    resources: [{group: "", resources: [events]}, {group: coordination.k8s.io, resources: [leases]}]
  - level: Metadata
    resources: [{group: "", resources: [secrets, configmaps, serviceaccounts/token]}, {group: authentication.k8s.io, resources: [tokenreviews]}]
  - level: RequestResponse
    resources: [{group: rbac.authorization.k8s.io}]
  - level: Request
    resources: [{group: "", resources: [pods/exec, pods/attach, pods/portforward]}]
  - level: Request
    verbs: [create, update, patch, delete, deletecollection]
  - level: Metadata
