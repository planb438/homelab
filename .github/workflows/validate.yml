name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/libvirt
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate every overlay
        run: |
          set -e
          for d in apps/*/overlays/* labs/[0-9]* platform/local-path platform/cert-issuers platform/argocd-ingress policies/kyverno; do
            echo "::group::$d"
            kubectl kustomize "$d" | kubeconform -strict -ignore-missing-schemas -summary
            echo "::endgroup::"
          done
      - name: Lab test scripts parse
        run: for f in labs/*/tests/test.sh scripts/*.sh; do bash -n "$f"; done
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ansible-core && ansible-galaxy collection install -r ansible/requirements.yml
      - run: cd ansible && ansible-playbook site.yml --syntax-check
