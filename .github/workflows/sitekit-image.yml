name: sitekit image
on:
  push:
    branches: [main]
    paths: ["apps/sitekit/app/**", ".github/workflows/sitekit-image.yml"]
  workflow_dispatch:
permissions:
  contents: write     # to commit the new image tag (GitOps)
  packages: write
concurrency: {group: lab-images-sitekit, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Test
        working-directory: apps/sitekit/app
        run: pip install -r requirements.txt pytest && python -m pytest -q
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: apps/sitekit/app
          push: true
          tags: ghcr.io/planb438/sitekit:edge,ghcr.io/planb438/sitekit:${{ github.sha }}
      - name: Roll out (commit new tag -> Argo CD)
        run: bash scripts/ci-bump-tag.sh "${{ github.sha }}" apps/site-*/overlays/*/kustomization.yaml apps/hq-backup/overlays/*/kustomization.yaml
