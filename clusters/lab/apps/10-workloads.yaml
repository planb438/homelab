# One Argo CD app per apps/<app>/overlays/<env>  →  deployed into namespace <env> (dev / stage / prod)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/planb438/homelab.git
        revision: HEAD
        directories:
          - path: apps/*/overlays/*
  template:
    metadata:
      name: '{{index .path.segments 1}}-{{.path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: https://github.com/planb438/homelab.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
