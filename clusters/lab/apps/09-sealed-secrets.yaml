# Sealed Secrets: encrypt a Secret with the cluster's public key so it is safe to commit to Git.
# Only this controller (private key, kube-system) can decrypt it. Replaces plaintext Secrets in Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0   # Renovate bumps this
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller   # the name kubeseal looks for by default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
